<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>Bangkok Weather · Travel Diary</title>
  <style>
    :root{--ink:#353943;--muted:#7f8590;--blue:#6aaed6;--line:#e8e9e8;--cream:#ffffff}
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;min-height:100%;background:transparent;font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--ink)}
    .weather{position:relative;overflow:hidden;display:flex;align-items:center;gap:22px;width:100%;min-height:160px;padding:25px 29px;border:1px solid #e7f0f6;border-radius:20px;background:linear-gradient(105deg,#ffffff 0%,#ffffff 25%,#f1faff 62%,#d8f0ff 100%)}
    .weather:before,.weather:after{content:"";position:absolute;border-radius:50%;pointer-events:none}.weather:before{width:166px;height:166px;left:-79px;bottom:-118px;background:#ffffff;opacity:.24}.weather:after{width:185px;height:185px;right:-88px;top:-123px;background:#ccebf9;opacity:.48}
    .intro,.forecast{position:relative;z-index:1}.intro{min-width:260px;flex:0 0 32%;display:flex;align-items:center;gap:16px}.icon-now{font-size:58px;line-height:1;filter:drop-shadow(0 4px 3px #d8e7ed66)}
    .eyebrow{font-weight:750;letter-spacing:.17em;font-size:10px;color:#89a2af}.place{font-family:Georgia,"Times New Roman",serif;font-size:22px;letter-spacing:.045em;font-weight:700;margin:4px 0 6px}.current{display:flex;align-items:baseline;gap:10px}.temp{font-size:38px;font-weight:750;letter-spacing:-.055em;line-height:1}.condition{font-size:12px;color:#777f88}.updated{font-size:10px;color:#9ca3a8;margin-top:9px}
    .divider{align-self:stretch;width:1px;background:linear-gradient(transparent,#dce9f1,transparent)}
    .forecast{flex:1;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px;text-align:center}.day{padding:8px 4px;border-radius:14px}.day:first-child{background:#ffffff7a}.weekday{font-size:12px;font-weight:720}.date{font-size:10px;color:#9a9fa6;margin-top:3px}.symbol{font-size:28px;line-height:1.5;margin:7px 0}.range{font-size:12px;font-weight:750;white-space:nowrap}.high{color:#e28c65}.low{color:#63a4c7}.slash{color:#b9c0c5;font-weight:400;margin:0 4px}.rain{font-size:10px;color:#82929d;margin-top:6px}
    .state{position:absolute;right:12px;bottom:7px;color:#a2a5a7;font-size:9px;z-index:2}
    @media(max-width:720px){.weather{gap:12px;padding:20px;min-height:0;flex-direction:column;align-items:stretch}.intro{flex:auto;min-width:0}.icon-now{font-size:48px}.place{font-size:20px}.temp{font-size:32px}.divider{height:1px;width:100%;background:linear-gradient(to right,transparent,#dce9f1,transparent)}.forecast{gap:2px}.day{padding:7px 2px}.symbol{font-size:24px}.weekday,.range{font-size:11px}.slash{margin:0 2px}.state{position:static;text-align:right;margin-top:-3px}}
    @media(max-width:380px){.weather{padding:14px 10px}.symbol{font-size:21px}.range{font-size:10px}.weekday{font-size:10px}.intro{gap:9px}}
  </style>
</head>
<body>
  <section class="weather" aria-label="태국 방콕 현재 날씨 및 5일 예보">
    <div class="intro">
      <span class="icon-now" id="now-icon" aria-hidden="true">🌤️</span>
      <div>
        <div class="eyebrow">MY TRAVEL DIARY · THAILAND</div>
        <div class="place">BANGKOK <span style="font-size:14px;color:#8ba9b9">☁</span></div>
        <div class="current"><span class="temp" id="now-temp">--°</span><span class="condition" id="now-label">날씨 불러오는 중</span></div>
        <div class="updated" id="updated">Bangkok local time · ICT (UTC+7)</div>
      </div>
    </div>
    <div class="divider" aria-hidden="true"></div>
    <div class="forecast" id="forecast" aria-label="앞으로 5일간 예보">
      <div class="day"><div class="weekday">—</div><div class="symbol">🌤️</div><div class="range">--° / --°</div></div>
      <div class="day"><div class="weekday">—</div><div class="symbol">🌤️</div><div class="range">--° / --°</div></div>
      <div class="day"><div class="weekday">—</div><div class="symbol">🌤️</div><div class="range">--° / --°</div></div>
      <div class="day"><div class="weekday">—</div><div class="symbol">🌤️</div><div class="range">--° / --°</div></div>
      <div class="day"><div class="weekday">—</div><div class="symbol">🌤️</div><div class="range">--° / --°</div></div>
    </div>
    <div class="state" id="state">Weather data: Open-Meteo</div>
  </section>
  <script>
    const endpoint = 'https://api.open-meteo.com/v1/forecast?latitude=13.7563&longitude=100.5018&current=temperature_2m,weather_code,is_day&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FBangkok&forecast_days=5';
    const $ = id => document.getElementById(id);
    function describe(code,isDay=true){
      if(code===0)return [isDay?'☀️':'🌙','맑음'];
      if(code===1||code===2)return [isDay?'🌤️':'☁️','대체로 맑음'];
      if(code===3)return ['☁️','흐림'];
      if(code===45||code===48)return ['🌫️','안개'];
      if([51,53,55,56,57].includes(code))return ['🌦️','이슬비'];
      if([61,63,65,66,67,80,81,82].includes(code))return ['🌧️','비'];
      if([71,73,75,77,85,86].includes(code))return ['🌨️','눈'];
      if([95,96,99].includes(code))return ['⛈️','뇌우'];
      return ['🌤️','날씨 정보'];
    }
    const dayNames=['일','월','화','수','목','금','토'];
    async function update(){
      try{
        const response=await fetch(endpoint,{cache:'no-store'});
        if(!response.ok)throw new Error('API response '+response.status);
        const data=await response.json();
        if(!data.current||!data.daily)throw new Error('Missing data');
        const [icon,label]=describe(data.current.weather_code,data.current.is_day===1);
        $('now-icon').textContent=icon;
        $('now-temp').textContent=Math.round(data.current.temperature_2m)+'°';
        $('now-label').textContent=label;
        const bangkokNow=new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Bangkok',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date());
        $('updated').textContent=`방콕 현지 ${bangkokNow} 기준 · ICT (UTC+7)`;
        $('forecast').replaceChildren();
        for(let i=0;i<Math.min(5,data.daily.time.length);i++){
          const dateText=data.daily.time[i];
          const date=new Date(dateText+'T12:00:00Z');
          const [symbol]=describe(data.daily.weather_code[i]);
          const hi=Math.round(data.daily.temperature_2m_max[i]);
          const lo=Math.round(data.daily.temperature_2m_min[i]);
          const rain=data.daily.precipitation_probability_max?.[i];
          const day=document.createElement('div');day.className='day';
          day.innerHTML=`<div class="weekday">${dayNames[date.getUTCDay()]+'요일'}</div><div class="date">${date.getUTCMonth()+1}/${date.getUTCDate()}</div><div class="symbol" aria-hidden="true">${symbol}</div><div class="range"><span class="high">${hi}°</span><span class="slash">/</span><span class="low">${lo}°</span></div><div class="rain">☂ ${Number.isFinite(rain)?rain+'%':'—'}</div>`;
          $('forecast').appendChild(day);
        }
        $('state').textContent='Forecast: Open-Meteo · 자동 갱신';
      }catch(error){
        $('now-label').textContent='날씨 연결 실패';
        $('updated').textContent='네트워크 연결 확인 후 새로고침';
        $('state').textContent='Open-Meteo 연결 필요';
        console.error('Weather update failed:',error);
      }
    }
    update();
    setInterval(update,30*60*1000);
  </script>
</body>
</html>
