
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taipei Weather Widget</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  font-family: Arial, sans-serif;
  background: transparent;
}

body {
  overflow-x: auto;
}

.weather-widget {
  display: flex;
  align-items: center;
  width: 100%;
  min-width: 650px;
  height: 110px;
  padding: 8px 16px;
  border-radius: 12px;
  background: #F7F0FA;
  color: #53446B;
}

/* Location */
.location {
  flex: 0 0 14%;
  padding-left: 8px;
}

.location-name {
  font-size: 14px;
  font-weight: 700;
  color: #222222; /* Black */
  white-space: nowrap;
}

.location-sub {
  margin-top: 4px;
  font-size: 11px;
  color: #90839C;
  letter-spacing: 1px;
}

/* Current weather */
.current-weather {
  flex: 0 0 21%;
  display: flex;
  align-items: center;
  justify-content: flex-start;
  gap: 10px;
  min-width: 0;
  padding-right: 8px;
}

.current-icon {
  width: 49px;
  height: 49px;
  flex-shrink: 0;
}

.current-info {
  min-width: 0;
}

.current-temp {
  font-size: 26px;
  font-weight: 600;
  color: #222222; /* Black */
  white-space: nowrap;
}

.current-desc {
  font-size: 11px;
  color: #90839C;
  margin-top: 3px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* Forecast */
.forecast {
  flex: 1;
  min-width: 0;
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  height: 100%;
}

.forecast-day {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-width: 0;
  border-left: 1px solid #E8DFF0;
}

.day-name {
  font-size: 12px;
  font-weight: 500;
  color: #806D97;
}

.day-icon {
  width: 29px;
  height: 29px;
}

.temperatures {
  display: flex;
  justify-content: center;
  gap: 8px;
  font-size: 12px;
  white-space: nowrap;
}

.temp-high {
  color: #D77CAE;
}

.temp-low {
  color: #819ACB;
}
</style>
</head>

<body>

<div class="weather-widget">

  <!-- Location -->
  <div class="location">
    <div class="location-name">TAIPEI</div>
    <div class="location-sub">WEATHER</div>
  </div>

  <!-- Current weather -->
  <div class="current-weather">
    <img
      id="currentIcon"
      class="current-icon"
      alt="Current weather"
    >
    <div class="current-info">
      <div id="currentTemp" class="current-temp">--°C</div>
      <div id="currentDesc" class="current-desc">
        Loading...
      </div>
    </div>
  </div>

  <!-- 5-day forecast -->
  <div class="forecast" id="forecast"></div>

</div>

<script>
const LATITUDE = 25.0330;
const LONGITUDE = 121.5654;
const TIMEZONE = "Asia/Taipei";

// SVG weather icons
function weatherIcon(code, isDay = true) {
  let icon = "";

  if (code === 0) {
    icon = `
      <circle cx="32" cy="32" r="12"
        fill="#FFD6A2"
        stroke="#E6B97C"
        stroke-width="2"/>
      <g stroke="#E6B97C"
        stroke-width="3"
        stroke-linecap="round">
        <path d="M32 6v8 M32 50v8
                 M6 32h8 M50 32h8
                 M13 13l6 6 M45 45l6 6
                 M51 13l-6 6 M19 45l-6 6"/>
      </g>
    `;
  } else if (code <= 3) {
    icon = `
      ${code <= 2 && isDay ? `
        <circle cx="22" cy="22" r="11"
          fill="#FFD6A2"
          stroke="#E6B97C"
          stroke-width="2"/>
      ` : ""}
      <path d="M18 47h30
        c9 0 12-8 9-14
        c-2-5-7-7-12-7
        c-3-10-16-13-23-5
        c-3 3-4 6-4 9
        c-8-1-13 5-13 11
        c0 5 5 6 13 6z"
        fill="#D9CEEB"
        stroke="#AD9BCB"
        stroke-width="2.5"
        stroke-linejoin="round"/>
    `;
  } else if (code === 45 || code === 48) {
    icon = `
      <path d="M15 28h34
               M10 37h44
               M17 46h30"
        fill="none"
        stroke="#AD9BCB"
        stroke-width="4"
        stroke-linecap="round"/>
    `;
  } else if (
    [51, 53, 55, 56, 57, 61, 63, 65,
     66, 67, 80, 81, 82].includes(code)
  ) {
    icon = `
      <path d="M18 40h30
        c12 0 12-15 1-17
        c-4-14-24-13-28 0
        c-14-1-17 17-3 17z"
        fill="#D9CEEB"
        stroke="#AD9BCB"
        stroke-width="2.5"/>
      <g stroke="#A699D5"
        stroke-width="3"
        stroke-linecap="round">
        <path d="M21 47l-3 7
                 M34 47l-3 7
                 M47 47l-3 7"/>
      </g>
    `;
  } else if (
    [71, 73, 75, 77, 85, 86].includes(code)
  ) {
    icon = `
      <path d="M18 40h30
        c12 0 12-15 1-17
        c-4-14-24-13-28 0
        c-14-1-17 17-3 17z"
        fill="#D9CEEB"
        stroke="#AD9BCB"
        stroke-width="2.5"/>
      <g fill="#B3A5DD">
        <circle cx="20" cy="51" r="3"/>
        <circle cx="33" cy="54" r="3"/>
        <circle cx="46" cy="51" r="3"/>
      </g>
    `;
  } else if ([95, 96, 99].includes(code)) {
    icon = `
      <path d="M18 40h30
        c12 0 12-15 1-17
        c-4-14-24-13-28 0
        c-14-1-17 17-3 17z"
        fill="#D9CEEB"
        stroke="#AD9BCB"
        stroke-width="2.5"/>
      <path d="M34 39l-8 13h8l-4 10
               15-17h-9l4-6z"
        fill="#F2C778"/>
    `;
  } else {
    icon = `
      <circle cx="32" cy="32" r="12"
        fill="#D9CEEB"
        stroke="#AD9BCB"
        stroke-width="2"/>
    `;
  }

  const svg = `
    <svg xmlns="http://www.w3.org/2000/svg"
         viewBox="0 0 64 64">
      ${icon}
    </svg>
  `;

  return "data:image/svg+xml;charset=utf-8," +
    encodeURIComponent(svg);
}

// English weather descriptions
function getDescription(code) {
  if (code === 0) return "Clear sky";
  if (code === 1) return "Mainly clear";
  if (code === 2) return "Partly cloudy";
  if (code === 3) return "Overcast";
  if ([45, 48].includes(code)) return "Foggy";
  if ([51, 53, 55, 56, 57].includes(code))
    return "Drizzle";
  if ([61, 63, 65, 66, 67].includes(code))
    return "Rainy";
  if ([80, 81, 82].includes(code))
    return "Rain showers";
  if ([71, 73, 75, 77, 85, 86].includes(code))
    return "Snowy";
  if ([95, 96, 99].includes(code))
    return "Thunderstorm";

  return "Cloudy";
}

// English weekday
function getDayName(dateString) {
  const date = new Date(dateString + "T12:00:00");

  return date.toLocaleDateString("en-US", {
    weekday: "short"
  });
}

// Fetch weather data
async function loadWeather() {
  const url =
    "https://api.open-meteo.com/v1/forecast" +
    `?latitude=${LATITUDE}` +
    `&longitude=${LONGITUDE}` +
    "&current=temperature_2m,weather_code,is_day" +
    "&daily=weather_code,temperature_2m_max,temperature_2m_min" +
    `&timezone=${TIMEZONE}` +
    "&forecast_days=6";

  try {
    const response = await fetch(url);

    if (!response.ok) {
      throw new Error("Weather API error");
    }

    const data = await response.json();
    const current = data.current;

    // Current temperature
    document.getElementById("currentTemp").textContent =
      Math.round(current.temperature_2m) + "°C";

    // Current weather description
    document.getElementById("currentDesc").textContent =
      getDescription(current.weather_code);

    // Current weather icon
    document.getElementById("currentIcon").src =
      weatherIcon(
        current.weather_code,
        current.is_day === 1
      );

    // Next 5 days
    const forecast = document.getElementById("forecast");
    forecast.innerHTML = "";

    for (let i = 1; i <= 5; i++) {
      const day = getDayName(data.daily.time[i]);
      const code = data.daily.weather_code[i];

      const max = Math.round(
        data.daily.temperature_2m_max[i]
      );

      const min = Math.round(
        data.daily.temperature_2m_min[i]
      );

      const item = document.createElement("div");
      item.className = "forecast-day";

      item.innerHTML = `
        <div class="day-name">${day}</div>
        <img
          class="day-icon"
          src="${weatherIcon(code)}"
          alt="${getDescription(code)}"
        >
        <div class="temperatures">
          <span class="temp-high">${max}°</span>
          <span class="temp-low">${min}°</span>
        </div>
      `;

      forecast.appendChild(item);
    }

  } catch (error) {
    console.error(error);

    document.getElementById("currentDesc").textContent =
      "Weather unavailable";
  }
}

// Initial load
loadWeather();

// Auto refresh every 30 minutes
setInterval(loadWeather, 30 * 60 * 1000);
</script>

</body>
</html>
